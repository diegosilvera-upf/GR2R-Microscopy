model: fastdvdnet
dataset: loreal
loss: prl

project_name: denoising-poisson-loreal-fastdvdnet-prl-q0.85
loreal_data_dir: /mnt/bdisk/dewil/loreal_POC2/sequences_almost_Poisson
loreal_split_file: txts/loreal_split.txt

gamma: 0.00392156862745098   # 1/255 -- gamma_tn (deepinv PoissonNoise gain convention)
thinning_q: 0.85
epochs: 80
batch_size: 32
val_batch_size: 32
lr: 0.0001
patch_size: 256
data_scale: 255.0
num_workers: 4
repeats_per_frame: 10
eval_seed: 43
checkpoint_every: 10
max_export_sequences: 2

val_prefixes: [HF1_, Mela1_]
test_prefixes: [HF2_, Mela2_]

# Transfer learning from FMDD FastDVDNet -- set pretrained_ckpt: null to train from scratch
pretrained_ckpt: /mnt/bdisk/dewil/loreal_POC2/sequences_for_self-supervised_tests/FastDVDnet_codes/FastDVDnet-pure_poisson-a=1-normalization_by_255.pth
inference_dir: null
